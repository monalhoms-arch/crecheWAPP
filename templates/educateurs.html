{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Éducateurs</h2>
<div class="card mb-3">
  <div class="card-header">Ajouter éducateur</div>
  <div class="card-body">
    <form method="POST" action="/educateurs/add" class="row g-2">
      <div class="col-md-6"><input class="form-control" name="nom" placeholder="Nom" required></div>
      <div class="col-md-5"><input class="form-control" name="specialite" placeholder="Spécialité"></div>
      <div class="col-md-1"><button class="btn btn-success w-100">Ajouter</button></div>
    </form>
  </div>
</div>
<div class="list-group">
  {% for ed in educateurs %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <div>{{ ed.nom }} <br><small class="text-muted">{{ ed.specialite }}</small></div>
      <a href="/educateurs/delete/{{ ed._id }}" class="btn btn-danger btn-sm">Supprimer</a>
    </div>
  {% endfor %}
</div>
{% endblock %}

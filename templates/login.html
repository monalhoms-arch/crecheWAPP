{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">Bienvenue</h2>
            <p class="text-muted">Connectez-vous à votre espace</p>
        </div>
        <form method="POST">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger">{{ messages[0] }}</div>
            {% endif %}
            {% endwith %}

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">NOM D'UTILISATEUR</label>
                <input type="text" name="username" class="form-control" placeholder="Entrez votre nom" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">MOT DE PASSE</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Se Connecter</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

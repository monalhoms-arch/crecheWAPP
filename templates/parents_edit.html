{% extends "base.html" %}
{% block content %}
<h3>Modifier parent</h3>
<form method="POST">
  <input name="nom" class="form-control mb-2" value="{{ parent.nom }}" required>
  <input name="email" class="form-control mb-2" value="{{ parent.email }}">
  <input name="telephone" class="form-control mb-2" value="{{ parent.telephone }}">
  <button class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}

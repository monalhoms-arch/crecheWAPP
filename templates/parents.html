{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Liste des parents</h2>
</div>

<div class="row">
  <div class="col-md-4 mb-4">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-header bg-white border-bottom-0 py-3">
        <h5 class="card-title mb-0 text-primary fw-bold">
          <i class="bi bi-person-plus-fill me-2"></i>Ajouter un parent
        </h5>
      </div>
      <div class="card-body">
        <form method="POST" action="/parents/add" class="d-grid gap-3">
          <div>
            <label class="form-label small text-muted fw-bold">NOM COMPLET</label>
            <input class="form-control" name="nom" placeholder="ex. M. Ahmed" required>
          </div>
          <div>
            <label class="form-label small text-muted fw-bold">EMAIL</label>
            <input class="form-control" name="email" placeholder="email@exemple.com">
          </div>
          <div>
            <label class="form-label small text-muted fw-bold">TÉLÉPHONE</label>
            <input class="form-control" name="telephone" placeholder="05 55 ...">
          </div>
          <button class="btn btn-primary mt-2">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th class="ps-4">Parent</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for p in parents %}
            <tr>
              <td class="ps-4 fw-bold">
                <div class="d-flex align-items-center">
                  <div class="avatar-circle me-3">{{ p.nom[0]|upper }}</div>
                  {{ p.nom }}
                </div>
              </td>
              <td>{{ p.email }}</td>
              <td>{{ p.telephone }}</td>
              <td class="text-end pe-4">
                <a href="/parents/edit/{{ p._id }}" class="btn btn-sm btn-outline-warning me-1">
                  <i class="bi bi-pencil"></i>
                </a>
                <a href="/parents/delete/{{ p._id }}" class="btn btn-sm btn-outline-danger"
                  onclick="return confirm('Confirmer la suppression ?')">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<style>
  .avatar-circle {
    width: 40px;
    height: 40px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--primary-color);
  }
</style>
{% endblock %}

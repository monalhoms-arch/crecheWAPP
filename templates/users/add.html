{% extends "base.html" %}
{% block content %}
<h2>Ajouter un Utilisateur</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Rôle</label>
                <select name="role" class="form-control" id="roleSelect" onchange="toggleRelated()" required>
                    <option value="admin">Admin</option>
                    <option value="parent">Parent</option>
                    <option value="educateur">Éducateur</option>
                    <option value="dietitian">Diététicien</option>
                </select>
            </div>

            <div class="mb-3" id="parentSelect" style="display:none;">
                <label>Lier au profil Parent :</label>
                <select name="related_id" class="form-control">
                    <option value="">-- Aucun --</option>
                    {% for p in parents %}
                    <option value="{{ p._id }}">{{ p.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3" id="educateurSelect" style="display:none;">
                <label>Lier au profil Éducateur :</label>
                <select name="related_id_ed" class="form-control"
                    onchange="document.querySelector('[name=related_id]').value = this.value">
                    <option value="">-- Aucun --</option>
                    {% for e in educateurs %}
                    <option value="{{ e._id }}">{{ e.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3" id="dietitianSelect" style="display:none;">
                <label>Lier au profil Nutritionniste :</label>
                <select name="related_id_diet" class="form-control"
                    onchange="document.querySelector('[name=related_id]').value = this.value">
                    <option value="">-- Aucun --</option>
                    {% for d in dietitians %}
                    <option value="{{ d._id }}">{{ d.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success">Créer</button>
        </form>
    </div>
</div>

<script>
    function toggleRelated() {
        var role = document.getElementById("roleSelect").value;
        document.getElementById("parentSelect").style.display = (role === 'parent') ? 'block' : 'none';
        document.getElementById("educateurSelect").style.display = (role === 'educateur') ? 'block' : 'none';
        document.getElementById("dietitianSelect").style.display = (role === 'dietitian') ? 'block' : 'none';


        // Reset if hiding (simplified)
        if (role !== 'parent' && role !== 'educateur') {
            // Clear logic if needed, but simple display toggle is enough for UI
        }
    }
</script>
{% endblock %}

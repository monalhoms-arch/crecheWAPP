{% extends "base.html" %}
{% block content %}
<h3>Ajouter paiement</h3>
<form method="POST">
  <div class="mb-2">
    <select name="enfant_id" class="form-control">
      {% for e in enfants %}<option value="{{ e._id }}">{{ e.nom }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-2"><input type="number" name="montant" class="form-control" placeholder="Montant" required></div>
  <button class="btn btn-success">Confirmer</button>
</form>
{% endblock %}

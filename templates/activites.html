{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Activités</h2>
<div class="card mb-3">
  <div class="card-header">Ajouter activité</div>
  <div class="card-body">
    <form method="POST" action="/activites/add" class="row g-2">
      <div class="col-md-4"><input class="form-control" name="titre" placeholder="Titre" required></div>
      <div class="col-md-4"><input class="form-control" name="date" type="date" required></div>
      <div class="col-md-3"><input class="form-control" name="description" placeholder="Description"></div>
      <div class="col-md-1"><button class="btn btn-success w-100">Ajouter</button></div>
    </form>
  </div>
</div>
<div class="list-group">
  {% for a in activites %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <div><strong>{{ a.titre }}</strong><br><small>{{ a.date }} — {{ a.description }}</small></div>
      <a href="/activites/delete/{{ a._id }}" class="btn btn-danger btn-sm">Supprimer</a>
    </div>
  {% endfor %}
</div>
{% endblock %}

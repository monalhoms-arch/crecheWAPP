version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: creche_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  flask:
    build: .
    container_name: creche_flask
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/creche_db

volumes:
  mongo_data:
